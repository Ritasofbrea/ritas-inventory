name: Vendor order reminders

# Patch 44: Vercel's Hobby-plan Cron only runs once a day (see vercel.json's
# two existing daily jobs), too coarse for a reminder that's supposed to
# repeat every reminder_interval_minutes (default 30) on a vendor's due
# day. This repo is public, so GitHub Actions minutes are free/unlimited --
# every 10 minutes, all day, is cheap here (not true for a private repo on
# the free plan; see the setup notes in the Phase 2 report if that ever
# changes). Running more often than any vendor's configured interval just
# means the route's own dedupe (vendor_reminder_log.last_sent_at) decides
# nothing fires early -- see src/app/api/cron/vendor-reminders/route.ts.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # lets Josh trigger a manual test run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call vendor-reminders cron route
        run: |
          curl -sS -f -X GET "${{ secrets.CRON_SITE_URL }}/api/cron/vendor-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
